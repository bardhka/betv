<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BETV Remote">
<title>BETV Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#0c0e12; --panel:#14171d; --raise:#1c2029; --raise2:#242a35; --line:#2a303b;
  --fg:#eef1f5; --fg2:#c9cfd8; --muted:#97a0ad; --dim:#677080;
  --accent:#ff6b3d; --accent-ink:#1c0b04; --live:#e5484d; --ok:#3dd68c;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
main{max-width:460px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;display:flex;align-items:center;line-height:1}
.logo b{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:3px 6px 4px;margin-left:3px}
.st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);text-align:right;min-width:0}
.st i{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--dim)}
.st.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(61,214,140,.15)}
.st.bad i{background:var(--live)}
.st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
h1{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:26px 0 10px}
.lead{color:var(--muted);line-height:1.55;margin:0 0 20px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
label{display:block;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
input{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--fg);font:600 16px var(--font-body);outline:none;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--accent)}
#code{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.btn{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:800 17px var(--font-body);padding:15px;cursor:pointer;width:100%}
.btn:disabled{opacity:.55}
.err{color:var(--live);font-weight:700;font-size:14px;min-height:18px;margin:10px 0 0}
.tabs{display:flex;gap:8px;margin:18px 0 12px}
.tab{flex:1;border:1px solid var(--line);background:var(--raise);color:var(--fg2);font:700 14px var(--font-body);border-radius:999px;padding:10px 6px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qrow{display:flex;gap:8px}
.qrow input{flex:1}
.qrow .btn{width:auto;padding:0 18px;font-size:16px}
.hint{color:var(--dim);font-size:13px;line-height:1.5;margin:8px 2px 0}
.pad{position:relative;width:250px;height:250px;margin:22px auto 6px;border-radius:50%;background:var(--raise);border:1px solid var(--line)}
.pad button{position:absolute;border:0;background:transparent;color:var(--fg);cursor:pointer;display:grid;place-items:center}
.pad .up,.pad .down{left:80px;width:90px;height:80px}
.pad .up{top:0}.pad .down{bottom:0}
.pad .left,.pad .right{top:80px;width:80px;height:90px}
.pad .left{left:0}.pad .right{right:0}
.pad .ok{left:80px;top:80px;width:90px;height:90px;border-radius:50%;background:var(--raise2);font:800 20px var(--font-body);border:1px solid var(--line)}
.pad svg{width:30px;height:30px}
.pad button:active,.keys button:active,.ok:active{background:rgba(255,107,61,.22)!important}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.keys button{border:1px solid var(--line);background:var(--raise);color:var(--fg);border-radius:14px;height:58px;display:grid;place-items:center;font:700 13px var(--font-body);cursor:pointer;padding:0}
.keys button svg{width:24px;height:24px}
.keys .wide{grid-column:span 2}
.keys .pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.num{grid-template-columns:repeat(3,1fr)}
.num button{font:800 22px var(--font-display);height:54px}
.sect{margin-top:22px}
.small{background:none;border:0;color:var(--accent);font:700 14px var(--font-body);padding:6px;cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:800;font-size:14px;border-radius:999px;padding:10px 18px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <header><div class="logo" aria-label="BETV">BE<b>TV</b></div><div class="st" id="st"><span id="st-t">Not connected</span><i></i></div></header>

  <section id="setup">
    <h1>Use your phone as a remote</h1>
    <p class="lead">On the TV, open Settings → Phone remote and scan the code, or type the code shown there.</p>
    <form class="card" id="code-form" autocomplete="off">
      <label for="code">Code on your TV</label>
      <input id="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9">
      <p class="err" id="code-err"></p>
      <button class="btn" type="submit">Connect</button>
    </form>
  </section>

  <section id="remote" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" data-mode="search" aria-pressed="true">Search</button>
      <button class="tab" data-mode="ask" aria-pressed="false">Ask BETV</button>
      <button class="tab" data-mode="type" aria-pressed="false">Type on TV</button>
    </div>
    <form class="qrow" id="q-form" autocomplete="off"><input id="q" enterkeyhint="send" placeholder="Search movies, shows, channels"><button class="btn" type="submit">Send</button></form>
    <p class="hint" id="q-hint">Shows the results on the TV.</p>

    <div class="pad" aria-label="Arrows">
      <button class="up" data-k="up" aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="left" data-k="left" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ok" data-k="ok">OK</button>
      <button class="right" data-k="right" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="down" data-k="down" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

    <div class="keys">
      <button data-k="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button data-k="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <button data-k="rew" aria-label="Back 10 seconds">−10 s</button>
      <button data-k="fwd" aria-label="Forward 30 seconds">+30 s</button>
      <button class="wide pri" data-k="play" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l11-7z"/></svg></button>
      <button data-k="chdown" aria-label="Channel down">CH −</button>
      <button data-k="chup" aria-label="Channel up">CH +</button>
    </div>

    <div class="sect">
      <button class="small" id="num-toggle" type="button">Numbers (PIN, channel)</button>
      <div class="keys num" id="num" hidden>
        <button data-k="d1">1</button><button data-k="d2">2</button><button data-k="d3">3</button>
        <button data-k="d4">4</button><button data-k="d5">5</button><button data-k="d6">6</button>
        <button data-k="d7">7</button><button data-k="d8">8</button><button data-k="d9">9</button>
        <button data-k="bksp">⌫</button><button data-k="d0">0</button><button data-k="ok">OK</button>
      </div>
    </div>

    <div class="foot"><span id="code-line"></span><button class="small" id="forget" type="button">Change TV</button></div>
    <p class="hint">Tip: for lots of browsing, the TV remote is quickest. The phone is best for typing, searching, Ask BETV and play controls.</p>
  </section>
</main>
<div class="toast" id="toast"></div>
